name: Release assets

# Runs when a GitHub Release is published for a vX.Y.Z tag. Builds both
# artifacts from the tagged commit and attaches them to the release:
#   sensemark-vX.Y.Z.zip         Chrome Web Store / "Load unpacked"
#   sensemark-safari-vX.Y.Z.zip  Safari kit for macOS (built locally with Xcode)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    name: Build and attach release assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check that the tag matches the manifest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./src/manifest.json").version')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match manifest version $version"
            exit 1
          fi

      - name: Run checks
        run: npm run verify

      - name: Build the Chrome archive and the Safari kit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npm run safari:kit
          node scripts/validate-extension.js "dist/sensemark-$TAG.zip"

      - name: Attach assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum "sensemark-$TAG.zip" "sensemark-safari-$TAG.zip" > SHA256SUMS.txt
          gh release upload "$TAG" "sensemark-$TAG.zip" "sensemark-safari-$TAG.zip" SHA256SUMS.txt --clobber
