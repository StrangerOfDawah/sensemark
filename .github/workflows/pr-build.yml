name: Sensemark release validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, browser smoke, and package
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked development dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: |
          mkdir -p dist
          set -o pipefail
          npm test 2>&1 | tee dist/test-output.txt

      - name: Validate extension source
        run: npm run check

      - name: Measure targeted critical-module coverage
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee dist/coverage-output.txt

      - name: Install Chromium for extension smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run automated browser smoke tests
        run: |
          set -o pipefail
          xvfb-run -a npm run test:browser:auto 2>&1 | tee dist/browser-output.txt

      - name: Build production and source archives
        run: |
          npm run package:extension
          npm run package:source

      - name: Verify deterministic production build
        run: npm run verify:reproducible

      - name: Validate packaged extension and artifacts
        run: |
          node scripts/validate-extension.js dist/sensemark-v1.4.2.zip
          npm run verify:artifacts
          mkdir -p dist/unpacked
          unzip -q dist/sensemark-v1.4.2.zip -d dist/unpacked
          test -f dist/unpacked/manifest.json
          test -f dist/unpacked/background/service-worker.js
          test -f dist/unpacked/popup/popup.html
          test -f dist/unpacked/options/options.html
          test -f dist/unpacked/sidepanel/sidepanel.html
          test ! -e dist/unpacked/tests
          test ! -e dist/unpacked/scripts
          test ! -e dist/unpacked/.github
          test ! -e dist/unpacked/node_modules
          test ! -e dist/unpacked/coverage
          test ! -e dist/unpacked/package.json
          test ! -e dist/unpacked/package-lock.json
          test ! -e dist/unpacked/REFACTOR_NOTES.md
          test ! -e dist/unpacked/RESEARCH_NOTES.md
          test ! -e dist/unpacked/TECHNICAL_REVIEW_REPORT.md

      - name: Upload production ZIP
        id: production-artifact
        uses: actions/upload-artifact@v7
        with:
          name: sensemark-v1.4.2-production
          path: dist/sensemark-v1.4.2.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: sensemark-v1.4.2-verification
          path: |
            dist/test-output.txt
            dist/coverage-output.txt
            dist/browser-output.txt
            dist/browser-results.json
            dist/browser-evidence/
            dist/reproducible-build.json
            dist/sensemark-v1.4.2-source.zip
            dist/sensemark-v1.4.2-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Add artifact summary
        env:
          ARTIFACT_URL: ${{ steps.production-artifact.outputs.artifact-url }}
        run: |
          {
            echo "## Sensemark v1.4.2 release candidate"
            echo
            echo "Production ZIP: $ARTIFACT_URL"
            echo
            echo "Store publication remains blocked until the manual Chrome PDF/user-activation checklist in BROWSER_ACCEPTANCE.md passes."
          } >> "$GITHUB_STEP_SUMMARY"
