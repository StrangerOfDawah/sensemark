<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sensemark</title>
    <link rel="stylesheet" href="../extension/extension.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Sensemark</h1>
      <p class="muted">Перевод на русский</p>
      <label class="field">
        <span>Текст</span>
        <textarea id="source" maxlength="20000" autofocus placeholder="Вставьте текст"></textarea>
      </label>
      <div class="toolbar">
        <button id="translate" class="primary" type="button">Перевести</button>
        <button id="copy" class="secondary" type="button">Копировать</button>
        <span class="spacer"></span>
        <button id="settings" class="secondary" type="button" title="Настройки">⚙</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
      <div id="actions" class="toolbar"></div>
      <div id="result" class="result" hidden></div>
    </main>
    <script src="../shared/config.js"></script>
    <script src="../shared/contracts.js"></script>
    <script src="../shared/errors.js"></script>
    <script src="../shared/result-renderer.js"></script>
    <script src="../shared/text-utils.js"></script>
    <script src="../shared/language-utils.js"></script>
    <script src="../shared/mode-utils.js"></script>
    <script src="../content/translation-client.js"></script>
    <script src="../extension/request-plan.js"></script>
    <script src="../extension/result-view.js"></script>
    <script src="../extension/translator-controller.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
